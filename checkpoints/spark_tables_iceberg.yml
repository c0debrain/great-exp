name: spark_table_validation_iceberg
spark:
  master: local[*]
  app_name: gx_spark_validation_iceberg
  config:
    spark.jars.packages: ${ICEBERG_SPARK_PACKAGES}
    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.demo: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.demo.type: ${ICEBERG_CATALOG_TYPE}
    spark.sql.catalog.demo.warehouse: ${ICEBERG_WAREHOUSE}
sources:
  iceberg_demo:
    kind: table
validations:
  - name: spark_customers
    type: spark_table
    source: iceberg_demo
    table: ${ICEBERG_CUSTOMERS_TABLE}
    rules:
      - rules/sql/customers_email_not_null.yml
      - rules/sql/customers_status_in_set.yml
  - name: spark_products
    type: spark_table
    source: iceberg_demo
    table: ${ICEBERG_PRODUCTS_TABLE}
    rules:
      - rules/sql/products_sku_not_null.yml
      - rules/sql/products_price_between_1_and_1000.yml
  - name: spark_orders
    type: spark_table
    source: iceberg_demo
    table: ${ICEBERG_ORDERS_TABLE}
    rules:
      - rules/sql/orders_customer_id_not_null.yml
      - rules/sql/orders_total_between_1_and_1000.yml
