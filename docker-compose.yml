services:
  postgres:
    image: postgres:16-alpine
    container_name: gx-postgres
    environment:
      POSTGRES_DB: gx_demo
      POSTGRES_USER: gx
      POSTGRES_PASSWORD: gx
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gx -d gx_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
